{% extends "auth_base.html" %}
{% block title %}Sign up · SpamShield AI{% endblock %}
{% block auth_content %}
<h1 class="auth-title">Create your account</h1>
<p class="auth-sub">Secure workspace for spam detection and analytics.</p>

<form method="post" class="auth-form" action="{{ url_for('signup') }}" novalidate>
  <label class="auth-label" for="username">Display name</label>
  <input class="auth-input" type="text" id="username" name="username" required autocomplete="name" maxlength="80" placeholder="Alex">

  <label class="auth-label" for="email">Email</label>
  <input class="auth-input" type="email" id="email" name="email" required autocomplete="email" placeholder="you@company.com">

  <label class="auth-label" for="password">Password</label>
  <input class="auth-input" type="password" id="password" name="password" required autocomplete="new-password" minlength="8" placeholder="At least 8 characters">

  <label class="auth-label" for="confirm">Confirm password</label>
  <input class="auth-input" type="password" id="confirm" name="confirm" required autocomplete="new-password" placeholder="Repeat password">

  <button type="submit" class="btn btn-primary btn-ripple btn-block auth-submit">Create account</button>
</form>

<p class="auth-switch">Already have an account? <a href="{{ url_for('login') }}">Sign in</a></p>
{% endblock %}
