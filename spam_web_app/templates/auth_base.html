<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}SpamShield AI{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="page-body auth-body">
  <div class="auth-backdrop" aria-hidden="true"></div>
  <button type="button" class="theme-toggle auth-theme-toggle" id="theme-toggle" aria-label="Toggle dark mode" title="Theme">
    <span class="theme-icon theme-icon-moon" aria-hidden="true">🌙</span>
    <span class="theme-icon theme-icon-sun" aria-hidden="true">☀️</span>
  </button>

  <main class="auth-main">
    <div class="auth-glass card-elevated">
      <a href="{{ url_for('login') }}" class="auth-logo-row">
        <span class="brand-icon"></span>
        <span class="auth-brand-name">SpamShield AI</span>
      </a>
      {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
          <div class="flash-stack auth-flash">
            {% for category, message in messages %}
              <div class="flash flash-{{ category }}">{{ message }}</div>
            {% endfor %}
          </div>
        {% endif %}
      {% endwith %}
      {% block auth_content %}{% endblock %}
    </div>
  </main>

  <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
